# Production-like, fault-tolerant topology:
#   * Postgres primary + streaming read replica (bitnami images)
#   * 3 stateless API replicas behind an nginx load balancer
#   * 2 outbox worker replicas (cooperate via FOR UPDATE SKIP LOCKED)
#   * shared Redis, Next.js frontend talking to the API through the LB
#
# Run:  docker compose -f docker-compose.scale.yml up --build
# Scale further at runtime:  docker compose -f docker-compose.scale.yml up -d --scale api=5
#
# This demonstrates the replication story described in the README. For real
# production you would also run multiple frontend replicas and an external
# managed Postgres with automated failover.

name: kabanos-scale

x-backend-env: &backend-env
  APP_ENV: production
  # Writes + read-your-write go to the primary; heavy reads fan out to replicas.
  POSTGRES_DSN: postgres://${POSTGRES_USER:-kabanos}:${POSTGRES_PASSWORD:-kabanos}@postgres-primary:5432/${POSTGRES_DB:-kabanos}?sslmode=disable
  POSTGRES_REPLICA_DSNS: postgres://${POSTGRES_USER:-kabanos}:${POSTGRES_PASSWORD:-kabanos}@postgres-replica:5432/${POSTGRES_DB:-kabanos}?sslmode=disable
  REDIS_ADDR: redis:6379
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong 32+ char secret for production}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
  CORS_ALLOWED_ORIGINS: ${PUBLIC_APP_URL:-http://localhost:3000}
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM_EMAIL: ${MAIL_FROM_EMAIL:-no-reply@kabanos.local}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  S3_ENDPOINT: minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-localhost:9000}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kabanos}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-kabanos-secret}
  S3_BUCKET: ${S3_BUCKET:-kabanos}
  S3_USE_SSL: "false"
  S3_ENABLED: "true"

services:
  postgres-primary:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-kabanos}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-kabanos}
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-kabanos}
      POSTGRESQL_REPLICATION_MODE: master
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
    volumes:
      - pg_primary:/bitnami/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kabanos} -d ${POSTGRES_DB:-kabanos}"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  postgres-replica:
    image: bitnami/postgresql:16
    environment:
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-kabanos}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:-kabanos}
      POSTGRESQL_MASTER_HOST: postgres-primary
      POSTGRESQL_MASTER_PORT_NUMBER: "5432"
      POSTGRESQL_REPLICATION_MODE: slave
      POSTGRESQL_REPLICATION_USER: replicator
      POSTGRESQL_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
    depends_on:
      postgres-primary:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kabanos}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kabanos-secret}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: api
    environment:
      <<: *backend-env
      HTTP_ADDR: ":8080"
      # Only ONE role needs to migrate; every replica tries but the advisory
      # lock serializes it, so this is safe.
      POSTGRES_AUTO_MIGRATE: "true"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    environment:
      <<: *backend-env
      POSTGRES_AUTO_MIGRATE: "false"
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      - api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://nginx:8080
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  pg_primary:
  redisdata:
  miniodata:
