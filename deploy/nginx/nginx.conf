# Load balancer for the stateless API replicas.
#
# Open-source nginx cannot use the `resolve` upstream directive (NGINX Plus
# only), so we proxy_pass to a *variable* containing the service name. That
# forces nginx to resolve `api` through Docker's embedded DNS (127.0.0.11) on
# every request; Docker returns the replica IPs in rotating order, giving simple
# round-robin across all API containers — and picks up scale up/down live.

worker_processes auto;
events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;

  resolver 127.0.0.11 valid=5s ipv6=off;

  server {
    listen 8080;
    server_name _;

    # Health of the LB itself.
    location = /_lb_health {
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      set $api_backend "http://api:8080";
      proxy_pass $api_backend;

      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Generate a request id if the client didn't send one, for tracing.
      proxy_set_header X-Request-ID $request_id;

      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
      # Retry the next replica if one is unreachable — resilience to a dead pod.
      proxy_next_upstream error timeout http_502 http_503 http_504;
    }
  }
}
